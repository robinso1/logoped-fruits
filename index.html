    .wash { z-index: -1; background: linear-gradient(180deg, rgb(255 249 222 / 7%) 0%, transparent 35%, rgb(255 249 225 / 4%) 52%, rgb(255 250 232 / 31%) 100%); }
    .progress { position: absolute; top: max(22px, env(safe-area-inset-top)); left: 50%; display: flex; align-items: center; gap: 10px; transform: translateX(-50%); }
    .leaf { width: 13px; height: 8px; border: 1px solid rgb(89 109 55 / 48%); border-radius: 100% 0 100% 0; background: rgb(255 251 226 / 82%); transform: rotate(-28deg); transition: background 450ms ease, transform 450ms ease, box-shadow 450ms ease; }
    .leaf.past { border-color: #688546; background: #82975b; }
    .leaf.current { background: #f5d977; box-shadow: 0 1px 7px rgb(96 89 42 / 27%); transform: rotate(-28deg) scale(1.22); }
    .prompt { position: absolute; top: 51.5%; left: 50%; display: grid; min-width: 148px; min-height: 82px; max-width: calc(100% - 44px); place-items: center; padding: 14px 25px 11px; border: 1.5px solid rgb(241 224 184 / 92%); border-radius: 28px 28px 25px 28px; background: rgb(255 254 248 / 96%); box-shadow: 0 9px 22px rgb(95 70 34 / 13%), inset 0 1px 0 #fff; color: #534731; cursor: pointer; transform: translateX(-50%); -webkit-tap-highlight-color: transparent; transition: transform 160ms ease, box-shadow 160ms ease; }
    .prompt::after { position: absolute; bottom: -8px; left: 27px; width: 16px; height: 16px; border-right: 1px solid rgb(241 224 184 / 92%); border-bottom: 1px solid rgb(241 224 184 / 92%); background: #fffef8; content: ""; transform: rotate(45deg); }
    .prompt.hint { animation: hint 1.6s ease-in-out infinite; }
    @keyframes hint { 0%,100% { transform: translateX(-50%) scale(1); } 50% { transform: translateX(-50%) scale(1.06); } }
    .prompt.busy { pointer-events: none; }
    .prompt:active { box-shadow: 0 4px 12px rgb(95 70 34 / 15%), inset 0 1px 0 #fff; transform: translateX(-50%) scale(.97); }
    .prompt:focus-visible, .restart:focus-visible { outline: 3px solid #77944f; outline-offset: 4px; }
    .phrase { position: relative; z-index: 1; font-size: clamp(25px, 7vw, 35px); font-weight: 750; letter-spacing: -.035em; line-height: 1.08; text-align: center; text-wrap: balance; }
    .echoes { position: relative; z-index: 1; display: flex; gap: 7px; margin-top: 8px; }
    .echoes i { width: 6px; height: 6px; border: 1px solid #b9ab80; border-radius: 50%; background: #fffdf7; transition: background 200ms ease, transform 200ms ease; }
    .echoes i.active { border-color: #93a764; background: #93a764; transform: scale(1.12); }
    .fruit-tray { position: absolute; right: 14px; bottom: max(18px, env(safe-area-inset-bottom)); left: 14px; display: grid; grid-template-columns: repeat(3, 1fr); align-items: center; min-height: 98px; padding: 8px 18px 10px; border: 1px solid rgb(244 232 202 / 88%); border-radius: 32px; background: rgb(255 253 246 / 90%); box-shadow: 0 8px 26px rgb(96 80 49 / 10%), inset 0 1px 0 #fff; transition: opacity 380ms ease, transform 520ms cubic-bezier(.2, .72, .23, 1); -webkit-backdrop-filter: blur(7px); backdrop-filter: blur(7px); }
    .fruit-slot { display: grid; min-width: 58px; height: 74px; place-items: center; border-radius: 24px; transition: background 280ms ease, transform 280ms ease, filter 280ms ease; }
    .fruit-slot.current { background: rgb(242 233 198 / 68%); transform: translateY(-3px); }
    .fruit-art { width: 63px; height: 63px; overflow: visible; filter: drop-shadow(0 4px 3px rgb(95 71 30 / 13%)); }
    .finish { position: absolute; inset: 0; pointer-events: none; }
    .basket-fruit { position: absolute; top: 42.5%; left: 74%; width: 19%; height: 9%; animation: arrive 850ms cubic-bezier(.16, .76, .24, 1) both; }
    .finish-fruit { position: absolute; width: 50%; height: auto; filter: drop-shadow(0 2px 2px rgb(65 42 17 / 22%)); }
    .finish-apple { bottom: -7%; left: 0; transform: rotate(-12deg); }
    .finish-banana { bottom: 5%; left: 24%; width: 76%; transform: rotate(16deg); }
    .finish-lemon { right: -4%; bottom: -10%; transform: rotate(14deg); }
    .restart { position: absolute; top: max(16px, env(safe-area-inset-top)); right: 16px; display: grid; width: 46px; height: 46px; place-items: center; border: 1px solid rgb(245 234 204 / 95%); border-radius: 50%; background: rgb(255 253 246 / 91%); box-shadow: 0 4px 14px rgb(75 68 40 / 12%); color: #5f7048; cursor: pointer; pointer-events: auto; }
    .restart svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; stroke-width: 1.8; }
    .fruit-tray.finished { opacity: 0; transform: translateY(22px) scale(.96); pointer-events: none; }
    @keyframes arrive { from { opacity: 0; transform: translate(-17vw, 25vh) scale(1.45) rotate(-16deg); } to { opacity: 1; transform: translate(0, 0) scale(1) rotate(0); } }
    @media (min-width: 600px) { .scene { border-radius: 26px; } }
    @media (max-width: 420px) {
      .prompt { top: 53%; min-width: 134px; min-height: 74px; padding-right: 20px; padding-left: 20px; }
      .fruit-tray { right: 10px; left: 10px; min-height: 88px; padding-right: 12px; padding-left: 12px; }
      .fruit-art { width: 57px; height: 57px; }
    }
    @media (max-height: 690px) {
      .prompt { top: 49%; }
      .fruit-tray { min-height: 78px; }
      .fruit-slot { height: 62px; }
      .fruit-art { width: 52px; height: 52px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="scene" aria-label="Логопедическая игра с фруктами">
      <div class="art" aria-hidden="true"></div>
      <div class="wash" aria-hidden="true"></div>
      <div class="progress" aria-hidden="true"><span class="leaf current"></span><span class="leaf"></span><span class="leaf"></span></div>
      <button class="prompt hint" type="button" aria-label="на">
        <span class="phrase">на</span>
        <span class="echoes" aria-hidden="true"><i></i><i></i></span>
      </button>
      <div class="fruit-tray" aria-hidden="true">
        <div class="fruit-slot" data-fruit="apple"></div>
        <div class="fruit-slot" data-fruit="banana"></div>
        <div class="fruit-slot" data-fruit="lemon"></div>
      </div>
      <div class="finish" hidden></div>
    </section>
  </main>
  <script>
    (() => {
      const stages = [

      let stageIndex = 0;
      let itemIndex = 0;
      let repeatCount = 0;
      let ended = false;

        if (fruit === 'banana') return `<svg class="fruit-art" viewBox="0 0 120 100" aria-hidden="true"><defs><linearGradient id="banana-${suffix}" x1="0" x2=".9" y1="0" y2="1"><stop stop-color="#fff090"/><stop offset=".48" stop-color="#f5d743"/><stop offset="1" stop-color="#dfaa27"/></linearGradient></defs><path d="M16 23c19 36 54 56 88 39-10 25-37 35-63 25C18 77 6 53 8 28c2-6 5-7 8-5Z" fill="url(#banana-${suffix})" stroke="#d7a52d" stroke-width="3"/><path d="M18 25c22 34 49 49 79 39" fill="none" stroke="#fff8bd" stroke-width="6" stroke-linecap="round" opacity=".75"/><path d="m8 25 5-8 8 3-3 8-7 2Zm92 36 8-5 5 4-4 9-8-2Z" fill="#6f6238"/></svg>`;
        return `<svg class="fruit-art" viewBox="0 0 100 100" aria-hidden="true"><defs><linearGradient id="lemon-${suffix}" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#fff17c"/><stop offset=".52" stop-color="#f2d333"/><stop offset="1" stop-color="#d7aa21"/></linearGradient></defs><path d="M17 51c7-5 11-22 29-26 18-5 26 6 38 12 9 5 11 16 2 22-9 6-13 22-30 26-18 5-26-6-38-12-10-5-11-16-1-22Z" fill="url(#lemon-${suffix})"/><path d="M19 50c6-4 12-20 28-24" fill="none" stroke="#fff7ae" stroke-width="4" stroke-linecap="round" opacity=".78"/><path d="M44 27c6-10 17-12 27-8-6 10-15 15-27 12" fill="#759542"/><path d="M14 50c-5 1-8 4-10 9 5 2 10 1 14-4m68 4c6 1 10-1 14-6-4-4-9-5-15-1" fill="#e2b92c"/></svg>`;
      }

      document.querySelectorAll('.fruit-slot').forEach((slot) => {
        const fruit = slot.dataset.fruit;
        slot.innerHTML = fruitSvg(fruit, `tray-${fruit}`);
      });

      function paint() {
        const item = stages[stageIndex][itemIndex];
        phrase.textContent = item.text;
        prompt.setAttribute('aria-label', item.text);
        echoPips.forEach((pip, index) => pip.classList.toggle('active', index < repeatCount));
        leaves.forEach((leaf, index) => {
          leaf.classList.toggle('past', index < stageIndex);
          leaf.classList.toggle('current', index === stageIndex);
        });
        document.querySelectorAll('.fruit-slot').forEach((slot) => {
          slot.classList.toggle('current', slot.dataset.fruit === item.fruit);
        });
      }

      function endGame() {
        ended = true;
        prompt.hidden = true;
        finish.hidden = false;
        finish.innerHTML = `<div class="basket-fruit">${fruitSvg('banana', 'finish-banana').replace('class="fruit-art"', 'class="finish-fruit finish-banana"')}${fruitSvg('apple', 'finish-apple').replace('class="fruit-art"', 'class="finish-fruit finish-apple"')}${fruitSvg('lemon', 'finish-lemon').replace('class="fruit-art"', 'class="finish-fruit finish-lemon"')}</div><button class="restart" type="button" aria-label="Начать сначала"><svg viewBox="0 0 24 24"><path d="M4.8 8.3A8 8 0 1 1 4 13"/><path d="M4.4 3.9v4.8h4.8"/></svg></button>`;
        tray.classList.add('finished');
        finish.querySelector('.restart').addEventListener('click', restart);
      }

      function restart() {
        stageIndex = 0;
        itemIndex = 0;
        repeatCount = 0;
        ended = false;
        prompt.hidden = false;
        finish.hidden = true;
        finish.innerHTML = '';
        tray.classList.remove('finished');
        prompt.classList.add('hint');
        paint();
      }

      const player = new Audio();
      let busy = false;
      function say(text, done) {
        let finished = false;
        const end = () => { if (finished) return; finished = true; player.onended = null; done && done(); };
        try {
          player.pause();
          player.src = AUDIO[text];
          player.currentTime = 0;
          player.onended = end;
          const pr = player.play();
          if (pr && pr.catch) pr.catch(end);
        } catch (e) { end(); }
        setTimeout(end, 4000);
      }
      function next() {
        repeatCount = 0;
        if (itemIndex < stages[stageIndex].length - 1) itemIndex += 1;
        else if (stageIndex < stages.length - 1) { stageIndex += 1; itemIndex = 0; }
        else { endGame(); return; }
        paint();
      }
      prompt.addEventListener('click', () => {
        if (ended || busy) return;
        prompt.classList.remove('hint');
        const text = stages[stageIndex][itemIndex].text;
        repeatCount += 1;
        paint();
        busy = true;
        prompt.classList.add('busy');
        say(text, () => {
          setTimeout(() => {
            busy = false;
            prompt.classList.remove('busy');
            if (repeatCount >= 2) next();
          }, repeatCount >= 2 ? 900 : 250);
        });
      });

      paint();
    })();
  </script>
